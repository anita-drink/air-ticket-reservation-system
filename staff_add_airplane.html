{% extends "base.html" %}

{% block content %}
<h1>Add Airplane</h1>

<p>Airplane will be added to your airline: <strong>{{ staff.airline_name }}</strong></p>

<form method="POST">
    <label>Airplane ID:</label><br>
    <input type="number" name="airplane_id" required><br><br>

    <h3>Seat Classes</h3>

    <label>Economy Capacity:</label><br>
    <input type="number" name="economy_capacity" min="0" value="0"><br><br>

    <label>Business Capacity:</label><br>
    <input type="number" name="business_capacity" min="0" value="0"><br><br>

    <label>First Capacity:</label><br>
    <input type="number" name="first_capacity" min="0" value="0"><br><br>

    <button type="submit">Add Airplane</button>
</form>

<p><a href="{{ url_for('staff_dashboard') }}">Back to Dashboard</a></p>
{% endblock %}
