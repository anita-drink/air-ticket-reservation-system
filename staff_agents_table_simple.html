{% if agents %}
<table border="1" cellpadding="6">
    <tr>
        <th>Booking Agent</th>
        <th>Tickets Sold</th>
        <th>Commission</th>
    </tr>

    {% for a in agents %}
    <tr>
        <td>{{ a.agent_email }}</td>
        <td>{{ a.tickets_sold }}</td>
        <td>{{ "%.2f"|format(a.commission or 0) }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No booking agent data found.</p>
{% endif %}
