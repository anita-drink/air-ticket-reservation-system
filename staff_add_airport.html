{% extends "base.html" %}

{% block content %}
<h1>Add Airport</h1>

<form method="POST">
    <label>3-Letter Airport Code:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Airport City:</label><br>
    <input type="text" name="city" required><br><br>

    <button type="submit">Add Airport</button>
</form>

<p><a href="{{ url_for('staff_dashboard') }}">Back to Dashboard</a></p>
{% endblock %}
