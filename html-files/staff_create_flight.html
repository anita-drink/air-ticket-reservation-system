{% extends "base.html" %}

{% block content %}
<h1>Create Flight</h1>

<p>Flight will be created for airline: <strong>{{ staff.airline_name }}</strong></p>

<form method="POST">
    <label>Flight Number:</label><br>
    <input type="text" name="flight_num" required><br><br>

    <label>Airplane ID:</label><br>
    <input type="number" name="airplane_id" required><br><br>

    <label>Departure Airport:</label><br>
    <input type="text" name="departure_airport" required><br><br>

    <label>Arrival Airport:</label><br>
    <input type="text" name="arrival_airport" required><br><br>

    <label>Departure Time:</label><br>
    <input type="datetime-local" name="departure_time" required><br><br>

    <label>Arrival Time:</label><br>
    <input type="datetime-local" name="arrival_time" required><br><br>

    <label>Base Price:</label><br>
    <input type="number" step="0.01" name="price" required><br><br>

    <label>Status:</label><br>
    <select name="flight_status">
        <option value="upcoming">upcoming</option>
        <option value="on-time">on-time</option>
        <option value="in-progress">in-progress</option>
        <option value="delayed">delayed</option>
    </select><br><br>

    <button type="submit">Create Flight</button>
</form>

<p><a href="{{ url_for('staff_dashboard') }}">Back to Dashboard</a></p>
{% endblock %}
