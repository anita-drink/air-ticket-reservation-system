{% extends "base.html" %}

{% block content %}
<h1>Customer Registration</h1>

<form method="POST">
    <label>Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <label>Building Number:</label><br>
    <input type="text" name="building_number" required><br><br>

    <label>Street:</label><br>
    <input type="text" name="street" required><br><br>

    <label>City:</label><br>
    <input type="text" name="city" required><br><br>

    <label>State:</label><br>
    <input type="text" name="state" required><br><br>

    <label>Phone Number:</label><br>
    <input type="text" name="phone_number" required><br><br>

    <label>Passport Number:</label><br>
    <input type="text" name="passport_number" required><br><br>

    <label>Passport Expiration:</label><br>
    <input type="date" name="passport_expiration" required><br><br>

    <label>Passport Country:</label><br>
    <input type="text" name="passport_country" required><br><br>

    <label>Date of Birth:</label><br>
    <input type="date" name="date_of_birth" required><br><br>

    <button type="submit">Register</button>
</form>
{% endblock %}
